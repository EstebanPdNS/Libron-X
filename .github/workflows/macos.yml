name: macOS
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Restore attributed dictionary packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/libron-dictionaries"
          gh release download v0.3 --repo EstebanPdNS/Libron-X --pattern 'Libron-X-v0.3.zip' --pattern 'Libron-X-v0.3.sha256' --dir "$RUNNER_TEMP/libron-dictionaries"
          cd "$RUNNER_TEMP/libron-dictionaries"
          shasum -a 256 -c Libron-X-v0.3.sha256
          ditto -x -k Libron-X-v0.3.zip extracted
          codesign --verify --deep --strict extracted/Libron-X.app
          cp -R extracted/Libron-X.app/Contents/Resources/BundledDictionaries/Packages "$GITHUB_WORKSPACE/BibliotecaLibre/Resources/BundledDictionaries/"
      - name: Test
        working-directory: BibliotecaLibre
        run: scripts/test.sh --no-parallel
      - name: Build current workspace
        working-directory: BibliotecaLibre
        run: scripts/build-rebuild-app.sh
